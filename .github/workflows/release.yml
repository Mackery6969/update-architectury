name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          flags=(--generate-notes --verify-tag)
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"

      # Points v1 at v1.2.3 so workflows can use `@v1`. Pre-releases and
      # backports to an older minor never move it.
      - name: Move major version tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          latest=$(git ls-remote --tags --refs origin "refs/tags/$major.*" \
            | sed 's|.*refs/tags/||' | grep -v -- - | sort -V | tail -n 1)
          if [ "$latest" != "$TAG" ]; then
            echo "$latest is newer than $TAG; leaving $major where it is"
            exit 0
          fi
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"
